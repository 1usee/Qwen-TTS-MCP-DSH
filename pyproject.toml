[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-voice-mcp"
version = "1.0.0"
description = "MCP server exposing Qwen/DashScope speech models (TTS, voice cloning, balance) to DeepseekHarness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "dashscope", "qwen", "tts", "voice-cloning", "deepseek-harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mcp>=1.2.0",
    "dashscope>=1.20",
    "httpx>=0.27",
    "cryptography>=42",
    "keyring>=24",
    "soundfile>=0.12",
    "pydantic>=2.6",
    "filelock>=3.13",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qwen-voice-mcp = "qwen_voice_mcp.cli:main"

[tool.setuptools]
# `config.py` is a root-level leaf module (spec §4) that the core layer imports,
# so it ships alongside the package rather than inside it.
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen_voice_mcp*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The DSH file sandbox denies writes to `.pytest_cache` in this project root, which
# produced noisy PytestCacheWarnings on every run. Tests are unaffected; disable it.
addopts = ["-p", "no:cacheprovider"]
